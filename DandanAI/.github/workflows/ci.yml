name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check app tests
      - run: python -m pytest -q                      # mock providers + ephemeral TEST db (not Neon)
      - run: DATABASE_URL= alembic upgrade head --sql >/dev/null   # offline migration validation
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
  e2e-virtual:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -r backend/requirements.txt && (cd frontend && npm ci --no-audit --no-fund && npm run build)
      - run: bash scripts/virtual_e2e.sh
  neon-live:                      # optional: runs only if a disposable Neon branch secret is configured
    if: ${{ vars.NEON_LIVE_TESTS == 'true' }}
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && DIRECT_URL="${{ secrets.NEON_TEST_DIRECT_URL }}" alembic upgrade head && NEON_TEST_DIRECT_URL="${{ secrets.NEON_TEST_DIRECT_URL }}" python -m pytest -q tests/test_neon_live.py
